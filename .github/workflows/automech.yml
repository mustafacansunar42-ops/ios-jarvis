name: AutoMech build

on:
  push:
    paths: [ "AutoMech/**", ".github/workflows/automech.yml" ]
  pull_request:
    paths: [ "AutoMech/**", ".github/workflows/automech.yml" ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            extra: ""
            exe: AutoMechTools.exe
          - name: macOS
            os: macos-latest
            extra: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"'
            exe: AutoMechTools
    defaults:
      run:
        shell: bash
        working-directory: AutoMech

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DAUTOMECH_BUILD_TOOLS=ON ${{ matrix.extra }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: DSP tests
        run: ./build/AutoMechTools_artefacts/Release/${{ matrix.exe }} test

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: AutoMech-${{ matrix.name }}
          path: |
            AutoMech/build/AutoMech_artefacts/Release/VST3
            AutoMech/build/AutoMech_artefacts/Release/AU
            AutoMech/build/AutoMech_artefacts/Release/Standalone
          if-no-files-found: warn
